[package]
name = "watfaq-dns"
description = "A good DNS server"
license = "MIT"
repository = { workspace = true }
version = { workspace = true }
edition = { workspace = true }

[features]
default = ["aws-lc-rs"]
aws-lc-rs = [
    "rustls/aws-lc-rs",
]
ring = [
    "rustls/ring",
]

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
async-trait = "0.1"
futures = "0.3"
bytes = "1"

rustls = { version = "0.23", default-features = false }
tokio-rustls = { version = "0.26", default-features = false }
rustls-pemfile = "2"
webpki-roots = "1.0"

[dev-dependencies]
mockall = "0.14.0"
env_logger = "0.11"
anyhow = "1"
