[package]
name = "clash-rs"
repository = { workspace = true }
version = { workspace = true }
edition = { workspace = true }
homepage = { workspace = true }
authors = { workspace = true }

[features]
default = ["dashboard","aws-lc-rs","clash-lib/zero_copy","tproxy", "redir"]
standard = ["tun", "ssh", "shadowquic", "wireguard", "tailscale", "clash-lib/zero_copy", "tproxy", "redir"]
minimal = ["shadowsocks", "tuic"]

plus = ["standard", "onion"]
perf = ["plus", "jemallocator"]

android = ["shadowsocks", "tuic", "aws-lc-rs", "wireguard", "clash-lib/zero_copy", "tproxy"] # Android build failed with libc
bsd = ["shadowsocks", "tuic", "ring", "clash-lib/zero_copy"] # BSD build failed with aws-lc-rs, and cross compile also fail with missing headers for tun->route_manager

shadowsocks = ["clash-lib/shadowsocks"]
ssh = ["clash-lib/ssh"]
tuic = ["clash-lib/tuic"]
onion = ["clash-lib/onion"]
shadowquic = ["clash-lib/shadowquic"]
wireguard = ["clash-lib/wireguard"]
tailscale = ["clash-lib/tailscale"]
tproxy = ["clash-lib/tproxy"]
redir = ["clash-lib/redir"]
tun = ["clash-lib/tun"]

bench = ["clash-lib/bench"]
dashboard = ["clash-lib/dashboard"]
dhat-heap = ["dep:dhat"]
telemetry = ["clash-lib/telemetry"]
jemallocator = ["dep:tikv-jemallocator"]
mimalloc = ["dep:mimalloc"]

aws-lc-rs = ["dep:aws-lc-rs", "clash-lib/aws-lc-rs"]
ring = ["clash-lib/ring"]

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"

clash-lib = { path = "../clash-lib", default-features = false }

dhat = { version = "0.3", optional = true }
tikv-jemallocator = { version = "0.7", optional = true }
mimalloc = { version = "0.1", optional = true }

sentry = { version = "0.48", default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "rustls"] }
human-panic = "2.0"

aws-lc-rs = { version = "1.16", optional = true, default-features = false }



