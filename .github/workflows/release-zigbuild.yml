name: Release (cargo-zigbuild)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare-release:
    name: Prepare Release Tag
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.gen_tag.outputs.tag_name }}
    steps:
      - name: Generate Release Tag
        id: gen_tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="latest"
          fi
          echo "tag_name=${TAG}" >> $GITHUB_OUTPUT
          echo "Release tag: ${TAG}"

  build:
    uses: ./.github/workflows/zigbuild.yml
    permissions:
      contents: read

  publish-release:
    name: Create GitHub Release
    needs: [prepare-release, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate changelog
        env:
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag_name }}
        run: |
          BASE_REF=HEAD
          if [[ "${RELEASE_TAG}" != "latest" ]]; then
            BASE_REF=HEAD^
          fi
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 --match 'v*' "${BASE_REF}" 2>/dev/null || true)
          COMMIT_RANGE=HEAD
          if [[ -n "${PREVIOUS_TAG}" ]]; then
            COMMIT_RANGE="${PREVIOUS_TAG}..HEAD"
          fi

          {
            echo "## Changelog"
            echo
            git log --format='- %s (%h)' "${COMMIT_RANGE}" | awk '
              BEGIN {
                types[1] = "feat"; titles[1] = "Features"
                types[2] = "fix"; titles[2] = "Bug Fixes"
                types[3] = "perf"; titles[3] = "Performance"
                types[4] = "refactor"; titles[4] = "Refactoring"
              }
              {
                for (i = 1; i <= 4; i++) {
                  if ($0 ~ "^- " types[i] "(\\([^)]*\\))?!?: ") {
                    entries[i] = entries[i] $0 "\n"
                    count++
                    break
                  }
                }
              }
              END {
                for (i = 1; i <= 4; i++) {
                  if (entries[i] != "") {
                    print "### " titles[i] "\n"
                    printf "%s\n", entries[i]
                  }
                }
                if (!count) print "No feature, fix, performance or refactoring changes in this release."
              }
            '
          } > release-notes.md

      - name: Download build archives
        uses: actions/download-artifact@v8
        with:
          pattern: clash-rs-*
          path: artifacts

      - name: Organize release assets
        run: |
          mkdir -p release_assets
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} release_assets/ \;
          ls -la release_assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag_name }}
          name: Release ${{ needs.prepare-release.outputs.tag_name }}
          files: release_assets/*
          draft: false
          prerelease: false
          body_path: release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
