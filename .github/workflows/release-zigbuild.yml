name: Release (cargo-zigbuild)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare-release:
    name: Prepare Release Tag
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.gen_tag.outputs.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate Release Tag
        id: gen_tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="latest"
          fi
          echo "tag_name=${TAG}" >> $GITHUB_OUTPUT
          echo "Release tag: ${TAG}"

  build:
    name: Build (${{ matrix.archive-name }})
    needs: prepare-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86_64-unknown-linux-gnu
          - target: x86_64-unknown-linux-gnu
            archive-name: clash-rs-standard-x86_64-unknown-linux-gnu
            binary-name: clash-rs
            archive-ext: tar.gz
            features: standard,jemallocator,ebpf
            os: ubuntu-latest
            use-zigbuild: true
            opt-level: "3"
          - target: x86_64-unknown-linux-gnu
            archive-name: clash-rs-minimal-x86_64-unknown-linux-gnu
            binary-name: clash-rs
            archive-ext: tar.gz
            features: minimal,jemallocator,ebpf
            os: ubuntu-latest
            use-zigbuild: true
            opt-level: "3"

          # x86_64-unknown-linux-musl
          - target: x86_64-unknown-linux-musl
            archive-name: clash-rs-standard-x86_64-unknown-linux-musl
            binary-name: clash-rs
            archive-ext: tar.gz
            features: standard,jemallocator,ebpf
            os: ubuntu-latest
            use-zigbuild: true
            opt-level: "3"
          - target: x86_64-unknown-linux-musl
            archive-name: clash-rs-minimal-x86_64-unknown-linux-musl
            binary-name: clash-rs
            archive-ext: tar.gz
            features: minimal,jemallocator,ebpf
            os: ubuntu-latest
            use-zigbuild: true
            opt-level: "3"

          # aarch64-unknown-linux-gnu
          - target: aarch64-unknown-linux-gnu
            archive-name: clash-rs-standard-aarch64-unknown-linux-gnu
            binary-name: clash-rs
            archive-ext: tar.gz
            features: standard,jemallocator,ebpf
            os: ubuntu-latest
            use-zigbuild: true
            opt-level: "3"
          - target: aarch64-unknown-linux-gnu
            archive-name: clash-rs-minimal-aarch64-unknown-linux-gnu
            binary-name: clash-rs
            archive-ext: tar.gz
            features: minimal,jemallocator,ebpf
            os: ubuntu-latest
            use-zigbuild: true
            opt-level: "3"

          # aarch64-unknown-linux-musl
          - target: aarch64-unknown-linux-musl
            archive-name: clash-rs-standard-aarch64-unknown-linux-musl
            binary-name: clash-rs
            archive-ext: tar.gz
            features: standard,jemallocator,ebpf
            os: ubuntu-latest
            use-zigbuild: true
            opt-level: "s"
          - target: aarch64-unknown-linux-musl
            archive-name: clash-rs-minimal-aarch64-unknown-linux-musl
            binary-name: clash-rs
            archive-ext: tar.gz
            features: minimal,jemallocator,ebpf
            os: ubuntu-latest
            use-zigbuild: true
            opt-level: "s"

          # armv7-unknown-linux-gnueabihf
          - target: armv7-unknown-linux-gnueabihf
            archive-name: clash-rs-standard-armv7-unknown-linux-gnueabihf
            binary-name: clash-rs
            archive-ext: tar.gz
            features: standard,jemallocator,ebpf
            os: ubuntu-latest
            use-zigbuild: true
            opt-level: "s"
          - target: armv7-unknown-linux-gnueabihf
            archive-name: clash-rs-minimal-armv7-unknown-linux-gnueabihf
            binary-name: clash-rs
            archive-ext: tar.gz
            features: minimal,jemallocator,ebpf
            os: ubuntu-latest
            use-zigbuild: true
            opt-level: "s"

          # armv7-unknown-linux-musleabihf
          - target: armv7-unknown-linux-musleabihf
            archive-name: clash-rs-standard-armv7-unknown-linux-musleabihf
            binary-name: clash-rs
            archive-ext: tar.gz
            features: standard,jemallocator,ebpf
            os: ubuntu-latest
            use-zigbuild: true
            opt-level: "s"
          - target: armv7-unknown-linux-musleabihf
            archive-name: clash-rs-minimal-armv7-unknown-linux-musleabihf
            binary-name: clash-rs
            archive-ext: tar.gz
            features: minimal,jemallocator,ebpf
            os: ubuntu-latest
            use-zigbuild: true
            opt-level: "s"

          # riscv64gc-unknown-linux-musl
          - target: riscv64gc-unknown-linux-musl
            archive-name: clash-rs-minimal-riscv64gc-unknown-linux-musl
            binary-name: clash-rs
            archive-ext: tar.gz
            features: minimal,jemallocator,ebpf
            os: ubuntu-latest
            use-zigbuild: true
            opt-level: "s"

          # i686-unknown-linux-musl
          - target: i686-unknown-linux-musl
            archive-name: clash-rs-minimal-i686-unknown-linux-musl
            binary-name: clash-rs
            archive-ext: tar.gz
            features: minimal,jemallocator
            os: ubuntu-latest
            use-zigbuild: true
            opt-level: "s"

          # x86_64-apple-darwin
          - target: x86_64-apple-darwin
            archive-name: clash-rs-standard-x86_64-apple-darwin
            binary-name: clash-rs
            archive-ext: tar.gz
            features: standard
            os: macos-latest
            use-zigbuild: false
            opt-level: "3"
          - target: x86_64-apple-darwin
            archive-name: clash-rs-minimal-x86_64-apple-darwin
            binary-name: clash-rs
            archive-ext: tar.gz
            features: minimal
            os: macos-latest
            use-zigbuild: false
            opt-level: "3"

          # aarch64-apple-darwin
          - target: aarch64-apple-darwin
            archive-name: clash-rs-standard-aarch64-apple-darwin
            binary-name: clash-rs
            archive-ext: tar.gz
            features: standard
            os: macos-latest
            use-zigbuild: false
            opt-level: "3"
          - target: aarch64-apple-darwin
            archive-name: clash-rs-minimal-aarch64-apple-darwin
            binary-name: clash-rs
            archive-ext: tar.gz
            features: minimal
            os: macos-latest
            use-zigbuild: false
            opt-level: "3"

          # x86_64-pc-windows-gnu
          - target: x86_64-pc-windows-gnu
            archive-name: clash-rs-standard-x86_64-pc-windows-gnu
            binary-name: clash-rs.exe
            archive-ext: zip
            features: standard
            os: ubuntu-latest
            use-zigbuild: true
            opt-level: "3"
          - target: x86_64-pc-windows-gnu
            archive-name: clash-rs-minimal-x86_64-pc-windows-gnu
            binary-name: clash-rs.exe
            archive-ext: zip
            features: minimal
            os: ubuntu-latest
            use-zigbuild: true
            opt-level: "3"

          # aarch64-pc-windows-gnullvm
          - target: aarch64-pc-windows-gnullvm
            archive-name: clash-rs-standard-aarch64-pc-windows-gnullvm
            binary-name: clash-rs.exe
            archive-ext: zip
            features: standard
            os: ubuntu-latest
            use-zigbuild: true
            opt-level: "3"
          - target: aarch64-pc-windows-gnullvm
            archive-name: clash-rs-minimal-aarch64-pc-windows-gnullvm
            binary-name: clash-rs.exe
            archive-ext: zip
            features: minimal
            os: ubuntu-latest
            use-zigbuild: true
            opt-level: "3"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "clash-dashboard/package-lock.json"

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libclang-dev nasm ninja-build protobuf-compiler zip

      - name: Install System Dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install protobuf cmake nasm ninja

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Nightly Rust (for eBPF)
        if: runner.os == 'Linux'
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Install bpf-linker
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@bpf-linker

      - name: Setup Zig
        if: matrix.use-zigbuild
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install cargo-zigbuild
        if: matrix.use-zigbuild
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild@0.23.2

      - name: Build eBPF Bytecode
        if: runner.os == 'Linux'
        run: |
          cd clash-ebpf-bpf
          cargo +nightly build --release -Zbuild-std=core --target bpfel-unknown-none

      - name: Build with cargo-zigbuild
        if: matrix.use-zigbuild
        env:
          CARGO_PROFILE_RELEASE_OPT_LEVEL: ${{ matrix.opt-level }}
          MAKEFLAGS: "CC_MM="
        run: |
          cargo zigbuild --release --target ${{ matrix.target }} -F ${{ matrix.features }} -p clash-rs

      - name: Build with cargo (macOS native)
        if: "!matrix.use-zigbuild"
        env:
          CARGO_PROFILE_RELEASE_OPT_LEVEL: ${{ matrix.opt-level }}
        run: |
          cargo build --release --target ${{ matrix.target }} -F ${{ matrix.features }} -p clash-rs

      - name: Package Binary
        shell: bash
        run: |
          PKG_NAME="${{ matrix.archive-name }}"
          STAGING_DIR="dist/${PKG_NAME}"
          mkdir -p "${STAGING_DIR}"

          BIN_PATH="target/${{ matrix.target }}/release/${{ matrix.binary-name }}"
          cp "${BIN_PATH}" "${STAGING_DIR}/"
          cp README.md "${STAGING_DIR}/" 2>/dev/null || true
          cp LICENSE "${STAGING_DIR}/" 2>/dev/null || true

          cd dist
          if [ "${{ matrix.archive-ext }}" = "zip" ]; then
            zip -r "${PKG_NAME}.zip" "${PKG_NAME}"
          else
            tar -czvf "${PKG_NAME}.tar.gz" "${PKG_NAME}"
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.archive-name }}
          path: dist/*.${{ matrix.archive-ext }}
          retention-days: 1

  publish-release:
    name: Create GitHub Release
    needs: [prepare-release, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Organize release assets
        run: |
          mkdir -p release_assets
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} release_assets/ \;
          ls -la release_assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag_name }}
          name: Release ${{ needs.prepare-release.outputs.tag_name }}
          files: release_assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
