[package]
name = "clash-ebpf"
description = "eBPF datapath & transparent proxy inbound for clash-rs"
license = "MIT"
repository.workspace = true
version.workspace = true
edition.workspace = true
authors.workspace = true
homepage.workspace = true

[features]
default = []

[dependencies]
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
async-trait = "0.1"
futures = "0.3"
socket2 = { version = "0.6", features = ["all"] }
libc = "0.2"
ipnet = "2"
bytes = "1"
serde = { version = "1", features = ["derive"] }
network-interface = "2"
clash-ebpf-common = { path = "../clash-ebpf-common", features = ["user"] }
rtnetlink = "0.23"
netlink-packet-route = "0.33"
nix = { version = "0.31", default-features = false, features = ["net", "socket", "fs"] }
aya = { version = "0.14", default-features = false }
arc-swap = "1"



[dev-dependencies]
aya-obj = "0.3"
tokio-test = "0.4.5"
anyhow = "1"
yaml_serde = "0.10"

[lints]
workspace = true
